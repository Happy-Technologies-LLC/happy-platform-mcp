[graph]
targets = [
  "aarch64-apple-darwin", "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# Owner rule: no audit suppression. `ignore` stays empty unless the owner approves an entry in the PR;
# each entry then needs { id, reason } with a removal date in the reason.
ignore = []
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Allow-list only. Anything not listed is denied, which covers GPL, AGPL, LGPL, SSPL and BUSL.
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0", # weak copyleft, file-level; counsel confirms for closed distribution (owner decision 5)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [ # rustls only: static musl builds, one TLS stack
  { name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
