[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# release.yml is generated in a scratch git repo (scripts/gen-dist-ci.sh) and kept under
# dist-ci/ so it is NOT active; dist therefore must not check/rewrite it in-tree.
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# After dist publishes + announces, run the macOS sign/notarize + npm packaging workflow.
post-announce-jobs = ["./package-npm"]
# Second bin name for installers (shell: symlink, powershell: hardlink, npm: extra bin).
[dist.bin-aliases]
happy-platform-mcp = ["servicenow-mcp-server"]

# Windows Authenticode via Azure Artifact Signing (x86_64 only). PLACEHOLDER values: the owner
# supplies the real account/profile (see /tmp/hpm-specs/p1/s3-packaging-report.md section 4).
# The generated workflow reads AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID from
# GitHub secrets and runs signing jobs in the "release" environment (OIDC, no stored cert).
[dist.azure-windows-sign]
endpoint = "https://REPLACE-ME.codesigning.azure.net/"
account-name = "REPLACE-ME-account"
certificate-profile-name = "REPLACE-ME-profile"

