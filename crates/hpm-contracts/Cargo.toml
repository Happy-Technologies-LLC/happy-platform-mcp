[package]
name = "hpm-contracts"
description = "Transport-agnostic contracts (types and traits) of happy-platform-mcp: plan §5.2, contract RFC v0.2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Only the composition root enables this. Tool and handler crates depend on
# hpm-contracts WITHOUT it, so they cannot build a RequestContext, manufacture a
# principal or attach admission products (RFC v0.2 §2.1, review edit 6).
trusted-root = ["dep:uuid"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
uuid = { workspace = true, optional = true }
zeroize.workspace = true

[lints]
workspace = true
