[package]
name = "hpm-types"
description = "Transport-agnostic contracts (types and traits) of happy-platform-mcp: plan §5.2, contract RFC v0.2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Only the composition root enables this. It unlocks the constructors of
# `TrustedRoot` and `AdmissionKey`. Every other crate depends on hpm-types WITHOUT
# it, so it cannot manufacture a principal or attach admission products; the
# dispatcher receives a key minted by the root (RFC v0.2 §2.1, review edit 6).
trusted-root = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
uuid.workspace = true
zeroize.workspace = true

[lints]
workspace = true
