[package]
name = "hpm-tools"
description = "happy-platform-mcp tools: shared dispatcher pipeline, tool registration, single-user baseline services, pure-logic ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# No `trusted-root`: the dispatcher attaches admission products only with the
# `AdmissionKey` the composition root passes to `Dispatcher::new`.
hpm-types.workspace = true
hpm-core.workspace = true # G2/G1: PinnedClient and ConfigManager for families
hpm-docs.workspace = true # lane E: docs tools register from hpm-tools
reqwest.workspace = true # lane E: usage telemetry flush
tokio = { workspace = true, features = ["time", "sync"] } # lane E: telemetry timer
getrandom.workspace = true # lane E: telemetry session id
serde_json.workspace = true
thiserror.workspace = true
jsonschema.workspace = true # C6; root pin disables remote `$ref` fetching

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] } # CO-7: openat fix-script writes

[dev-dependencies]
tempfile.workspace = true # root pin =3.27.0; fix-script containment tests
# Tool-golden replay (tests/golden_tools.rs). hpm-cli is here only so this test
# binary may mint the AdmissionKey and build the stdio root: the composition root
# owns that capability, and a dev-dependency never reaches the lib or release builds.
hpm-cli.path = "../hpm-cli"
hpm-protocol.workspace = true
base64.workspace = true
regex.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "sync"] }

# Custom runner: one named case per golden (`<group>::<tool>__<case>`), and a
# filter that selects no golden fails instead of passing with 0 tests.
[[test]]
name = "golden_tools"
harness = false

[lints]
workspace = true
