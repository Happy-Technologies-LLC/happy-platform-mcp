[package]
name = "hpm-tools"
description = "happy-platform-mcp tools: shared dispatcher pipeline, tool registration, single-user baseline services, pure-logic ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# No `trusted-root`: the dispatcher attaches admission products only with the
# `AdmissionKey` the composition root passes to `Dispatcher::new`.
hpm-types.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Schema validation (C6). No default features: they pull reqwest + aws-lc for remote
# `$ref` resolution, which tool schemas never need and a validator must not do.
jsonschema = { version = "=0.61.2", default-features = false }

[dev-dependencies]
hpm-types = { workspace = true, features = ["trusted-root"] }
tokio.workspace = true
tokio-util.workspace = true

[lints]
workspace = true
