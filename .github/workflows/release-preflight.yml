# Release preflight (design §2.9 stage 0, gate R-1). Called by release.yml (dist `plan-jobs`)
# before any build. Refuses the release unless:
#   1. the tag equals v<[workspace.package].version> of the tagged commit;
#   2. the tagged commit is on origin/main's FIRST-PARENT history (a commit main itself pointed at,
#      not an intermediate commit of a merged branch);
#   3. Rust CI and Rust conformance succeeded on exactly that commit, in a push run on main.
# Every API error fails the job (fail closed).
name: Release preflight

on:
  workflow_call:

permissions:
  contents: read

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag equals workspace version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ "$REF_TYPE" = tag ] || { echo "::error::release must run from a tag push (got $REF_TYPE)"; exit 1; }
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match workspace version v$version"; exit 1; }
          echo "tag $TAG matches workspace version $version"

      - name: Tagged commit is on main (first-parent)
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          # grep without -q reads all input: -q exits on the first match, rev-list then dies of
          # SIGPIPE, and pipefail fails the step exactly when the tag is on main.
          git rev-list --first-parent origin/main | grep -xF "$GITHUB_SHA" >/dev/null \
            || { echo "::error::$GITHUB_SHA is not on main's first-parent history; refusing to release"; exit 1; }
          echo "$GITHUB_SHA is on origin/main (first-parent)"

      - name: Rust CI succeeded on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for wf in rust-ci.yml rust-conformance.yml; do
            # gh exits non-zero on any HTTP/API error, which fails this step (fail closed).
            runs="$(gh api --method GET "repos/$REPO/actions/workflows/$wf/runs" \
              -f head_sha="$GITHUB_SHA" -f branch=main -f event=push -f per_page=100)"
            conclusion="$(jq -r '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA
                and .head_branch == "main" and .event == "push")]
              | sort_by(.created_at) | last | .conclusion // "missing"' <<<"$runs")"
            [ "$conclusion" = success ] \
              || { echo "::error::$wf on $GITHUB_SHA: latest push run on main is '$conclusion', need success"; exit 1; }
            echo "$wf: success on $GITHUB_SHA"
          done
          # No check run on the commit may have failed (catches re-runs and other required checks).
          # Exception: the "Dependabot" check is GitHub's dependency-update job, which attaches to
          # the default-branch head but builds and tests nothing in it (it fails when it cannot
          # open an update PR, e.g. for a dev-only advisory with no compatible fix).
          checks="$(gh api --paginate --slurp "repos/$REPO/commits/$GITHUB_SHA/check-runs?per_page=100")"
          bad="$(jq -r '[.[].check_runs[] | select(.status == "completed" and .name != "Dependabot" and
              (.conclusion | IN("failure","cancelled","timed_out","action_required","startup_failure")))
              | "\(.name): \(.conclusion)"] | .[]' <<<"$checks")"
          [ -z "$bad" ] || { echo "::error::failed check runs on $GITHUB_SHA:"; echo "$bad"; exit 1; }
          echo "no failed check runs on $GITHUB_SHA"
