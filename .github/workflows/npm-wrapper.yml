# Unit tests for the 7.x npm wrapper (launcher shim) and scripts/release/assemble-npm.mjs.
name: npm-wrapper

on:
  push:
    branches: [main, "rust-replatform/**"]
    paths:
      - "npm/**"
      - "scripts/release/assemble-npm.mjs"
      - ".github/workflows/npm-wrapper.yml"
  pull_request:
    branches: [main, "rust-replatform/**"]
    paths:
      - "npm/**"
      - "scripts/release/assemble-npm.mjs"
      - ".github/workflows/npm-wrapper.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: node --test
        shell: bash
        run: node --test "npm/test/*.test.mjs"
