# Release supply chain (design §2.9 stages 4-5, gates R-2/R-3). Called by release.yml
# (dist `host-jobs`) after `host` created the draft release and before every publish job.
#
# Split per R-2:
#   sbom  unprivileged; CycloneDX SBOM per shipped binary, from the tagged COMMIT, no caches.
#   sign  privileged (id-token, attestations, contents:write); consumes artifacts of THIS run only
#         (dist build jobs + sbom job), never the mutable draft release; runs no third-party code
#         beyond the pinned signing actions.
#
# Signer identity (what verify-release.sh pins): this file's job_workflow_ref,
#   https://github.com/<owner>/<repo>/.github/workflows/release-supply-chain.yml@refs/tags/v<version>
name: Release supply chain

on:
  workflow_call:
    inputs:
      plan:
        description: dist plan manifest (JSON), passed by release.yml
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }} # the commit, not the movable tag
          persist-credentials: false
      # Toolchain comes from rust-toolchain.toml (rustup on the runner image); no cache restore
      # anywhere on the release path (R-2).
      - name: Install cargo-cyclonedx (pinned, locked, no cache)
        run: cargo install cargo-cyclonedx --version 0.5.10 --locked
      - name: CycloneDX SBOM per binary
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
          # --target all: the SBOM covers every release target's dependency graph.
          cargo cyclonedx --manifest-path crates/hpm-cli/Cargo.toml --format json --spec-version 1.5 \
            --describe binaries --target all
          mkdir -p sbom
          for bin in happy-platform-mcp servicenow-mcp-server happy-platform-mcp-http; do
            mv "crates/hpm-cli/${bin}_bin.cdx.json" "sbom/${bin}.cdx.json"
          done
          ls -l sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  sign:
    name: sign
    needs: [sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # attach checksums, signature bundle and SBOMs to the draft release
      id-token: write # keyless cosign + attestations
      attestations: write
    env:
      GH_REPO: ${{ github.repository }} # no checkout in this job
    steps:
      # Artifacts of THIS workflow run only (dist build jobs + sbom job); never the draft release.
      - name: Fetch dist build artifacts (this run)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-*
          merge-multiple: true
          path: dist-out
      - name: Fetch SBOMs (this run)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: supply-chain-sbom
          path: dist-out
      - name: Plan belongs to this tag
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          planned="$(jq -r '.announcement_tag' <<<"$PLAN")"
          [ "$planned" = "$TAG" ] || { echo "::error::dist plan tag '$planned' != $TAG"; exit 1; }
      - name: Archives match the digests the build jobs reported
        working-directory: dist-out
        run: |
          set -euo pipefail
          rm -f -- *-dist-manifest.json
          n=0
          for f in *.tar.xz *.zip; do
            [ -f "$f.sha256" ] || { echo "::error::missing $f.sha256"; exit 1; }
            sha256sum -c "$f.sha256"
            n=$((n + 1))
          done
          [ "$n" -eq 5 ] || { echo "::error::expected 5 archives, found $n"; exit 1; }
      # Every asset this run produced and the release carries: archives, installers, Homebrew formula,
      # source tarball, dist's own sha256.sum, SBOMs. A missing file fails sha256sum.
      - name: Aggregate checksums
        working-directory: dist-out
        run: |
          set -euo pipefail
          sha256sum -- *.tar.xz *.zip *-installer.sh *-installer.ps1 *.rb source.tar.gz sha256.sum \
            *.cdx.json > SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance for every release asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-out/*.tar.xz
            dist-out/*.zip
            dist-out/*-installer.sh
            dist-out/*-installer.ps1
            dist-out/*.rb
            dist-out/source.tar.gz
            dist-out/sha256.sum
            dist-out/SHA256SUMS
      - name: Attest SBOM (happy-platform-mcp) against the archives
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist-out/*.tar.xz
            dist-out/*.zip
          sbom-path: dist-out/happy-platform-mcp.cdx.json
      - name: Attest SBOM (servicenow-mcp-server) against the archives
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist-out/*.tar.xz
            dist-out/*.zip
          sbom-path: dist-out/servicenow-mcp-server.cdx.json
      - name: Attest SBOM (happy-platform-mcp-http) against the archives
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist-out/*.tar.xz
            dist-out/*.zip
          sbom-path: dist-out/happy-platform-mcp-http.cdx.json
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign checksum file (keyless)
        run: cosign sign-blob --yes --bundle dist-out/SHA256SUMS.sigstore.json dist-out/SHA256SUMS
      - name: Keep the signed set as a run artifact for downstream jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain
          path: |
            dist-out/SHA256SUMS
            dist-out/SHA256SUMS.sigstore.json
            dist-out/*.cdx.json
          if-no-files-found: error
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --clobber \
            dist-out/SHA256SUMS dist-out/SHA256SUMS.sigstore.json dist-out/*.cdx.json
